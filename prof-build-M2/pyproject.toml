[project]
name = "remitright-la"
version = "0.1.0"
description = "Reproducible CHIRLA remittance outreach briefing notebook"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "openpyxl",
    "matplotlib",
    "ipython",
    "jupyterlab",
    "ipykernel",
    "pytest",
    "nbclient",
    "nbformat",
    "streamlit>=1.66.1",
    "plotly>=7.1.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
